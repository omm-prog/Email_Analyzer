<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Forensics Tool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Email Forensics Web Tool</h1>
    <p>Just upload your email file and click analyze.</p>

    <form action="/analyze" method="post" enctype="multipart/form-data" class="card">
      <label for="file">Upload Email / .eml File</label>
      <input id="file" type="file" name="file" accept=".eml,.email,message/rfc822" required>
      {% if error %}
      <p class="danger">{{ error }}</p>
      {% endif %}
      <button type="submit">Analyze Email</button>
    </form>
  </div>
</body>
</html>
